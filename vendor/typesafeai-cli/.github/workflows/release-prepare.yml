name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes since last tag
        id: check
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "No tags yet — first release can proceed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          COMMITS=$(git rev-list "${CURRENT_TAG}..HEAD" --count)
          echo "Commits since ${CURRENT_TAG}: ${COMMITS}"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  release:
    name: Bump, commit, tag
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            CURRENT_TAG=$(git describe --tags --abbrev=0)
            VERSION="${CURRENT_TAG#v}"
          else
            CURRENT_TAG="v0.0.0"
            VERSION="0.0.0"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "current-tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new-tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT_TAG}"
          echo "Next:    ${NEW_TAG} (${BUMP} bump)"

      - name: Preflight check
        run: |
          NEW_TAG="${{ steps.version.outputs.new-tag }}"
          if git tag -l "$NEW_TAG" | grep -q .; then
            echo "::error::Tag '${NEW_TAG}' already exists."
            exit 1
          fi

      - name: Bump version files
        run: |
          NEW_VERSION="${{ steps.version.outputs.new-version }}"
          python3 - <<PY
          from pathlib import Path
          version = "${NEW_VERSION}"
          py = Path("pyproject.toml")
          text = py.read_text()
          import re
          text, n = re.subn(r'^version = "[^"]+"', f'version = "{version}"', text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("failed to bump pyproject.toml")
          py.write_text(text)
          init = Path("src/typesafe_cli/__init__.py")
          init.write_text(f'__version__ = "{version}"\n')
          PY

      - name: Commit to main and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.version.outputs.new-tag }}"
          NEW_VERSION="${{ steps.version.outputs.new-version }}"
          CURRENT_TAG="${{ steps.version.outputs.current-tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml src/typesafe_cli/__init__.py
          git commit -m "$(cat <<EOF
          chore(release): bump version to ${NEW_TAG}

          Update package version ${CURRENT_TAG#v} → ${NEW_VERSION}.
          EOF
          )"

          git push origin HEAD:main
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Tagged and pushed ${NEW_TAG}"

          # GITHUB_TOKEN tag pushes do not start other workflows. Kick Release ourselves.
          gh workflow run release.yml --ref "$NEW_TAG"
